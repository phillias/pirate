# Pirate stack CI — shellcheck + YAML validation + compose config check
# Uses SHA-pinned actions per Chainguard best practices.
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae5002e482c5f907c5e2544e7def39f5ae5dc # 2.0.0
        env:
          SHELLCHECK_OPTS: -x
        with:
          severity: warning
          additional_paths: lib/pirate-common.sh

  yaml-validate:
    name: YAML validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate YAML files
        run: |
          python3 -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if 'node_modules' in f or '.terraform' in f:
                  continue
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'  ❌ {e}')
              sys.exit(1)
          print(f'✅ All YAML files valid')
          "

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate compose.yaml
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not available — skipping compose config check"
            exit 0
          fi
          # Validate without requiring .env secrets (use empty defaults)
          PUID=1000 PGID=1000 TZ=UTC \
          DATABASE_USERNAME=test DATABASE_PASSWORD=test \
          SHADOWSOCKS_PASSWORD=test WIREGUARD_PRIVATE_KEY=test \
          HTTP_CONTROL_SERVER_AUTH=test \
          docker compose --profile all config --quiet 2>&1 || {
            echo "⚠️  compose config check failed (may need env vars) — non-blocking"
            exit 0
          }
          echo "✅ compose.yaml valid"
